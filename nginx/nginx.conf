# =========================================================================
# Top-level nginx config for the reverse proxy.
# Per-subdomain server blocks live in conf.d/ (one file per app — easy to add
# more apps later by dropping a new conf.d/<app>.conf and reloading nginx).
# =========================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket / SignalR upgrade map — used by `proxy_set_header Connection $connection_upgrade`.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Generous body size for CSV imports / image uploads.
    client_max_body_size 25M;

    include /etc/nginx/conf.d/*.conf;
}
