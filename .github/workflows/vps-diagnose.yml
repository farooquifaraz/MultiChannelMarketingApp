# Temporary, read-only TLS/443 diagnostic — runs ON the VPS via the self-hosted runner.
# Manual dispatch only. Never mutates anything; prints state so we can pinpoint why HTTPS (443) is down.
name: VPS Diagnose TLS

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose 443 / TLS
    runs-on: [self-hosted, marketingapp]
    steps:
      - name: Collect TLS / nginx / firewall state
        shell: bash
        run: |
          set +e
          cd /opt/marketingapp 2>/dev/null
          echo "===== docker compose ps ====="
          docker compose -f docker-compose.prod.yml ps
          echo "===== nginx container state ====="
          docker inspect -f 'status={{.State.Status}} restarts={{.RestartCount}} startedAt={{.State.StartedAt}}' marketingapp-nginx 2>&1
          echo "===== nginx logs (tail 150) ====="
          docker logs marketingapp-nginx --tail 150 2>&1
          echo "===== nginx -t (config test) ====="
          docker exec marketingapp-nginx nginx -t 2>&1
          echo "===== host listeners :80 / :443 ====="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':80 |:443 '
          echo "===== curl https://localhost (from the VPS) ====="
          curl -k -I https://localhost --max-time 8 2>&1 | head -8
          echo "===== curl http://localhost (from the VPS) ====="
          curl -I http://localhost --max-time 8 2>&1 | head -8
          echo "===== cert directory ====="
          ls -la /etc/letsencrypt/live/ 2>&1
          ls -la /etc/letsencrypt/live/app.samdigital.ae/ 2>&1
          echo "===== cert subject + expiry ====="
          openssl x509 -subject -enddate -noout -in /etc/letsencrypt/live/app.samdigital.ae/fullchain.pem 2>&1
          echo "===== firewall (ufw) ====="
          sudo -n ufw status 2>&1 || echo "(no passwordless sudo or ufw not installed)"
          echo "===== certbot presence ====="
          which certbot 2>&1; certbot --version 2>&1
          echo "===== DONE ====="
          exit 0
