# =========================================================================
# CI/CD — on push to master, build + deploy to the VPS
#
# Flow:
#   1. ci   — restore + build .NET API and frontend, fail fast on errors
#              (so a bad push is rejected BEFORE we touch the live server)
#   2. deploy — SSH into the VPS, `git pull` + `docker compose up -d --build`
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         — VPS public IP or hostname
#   VPS_USER         — SSH user (e.g. root or deploy)
#   VPS_SSH_KEY      — full PRIVATE SSH key (matched to a public key in
#                       /root/.ssh/authorized_keys on the VPS)
#   VPS_DEPLOY_PATH  — absolute path on VPS, e.g. /opt/marketingapp
# =========================================================================

name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:   # lets you trigger a redeploy manually from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  ci:
    name: Build + verify
    runs-on: ubuntu-latest
    # K1: a real Postgres for the regression-test fixture. Same image we run in prod.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: yourpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Pickup by RegressionTestFactory at fixture init.
      TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=marketingapp_test;Username=postgres;Password=yourpassword;Pooling=true;MinPoolSize=2;MaxPoolSize=10"
    steps:
      - uses: actions/checkout@v4

      # --- Backend ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore + build API
        run: |
          dotnet restore src/MarketingApp.API/MarketingApp.API.csproj
          dotnet build   src/MarketingApp.API/MarketingApp.API.csproj -c Release --no-restore

      # --- K1: regression-test harness ---
      # Runs the 17-item Zero-Regression Checklist (currently 29 xUnit tests
      # under MarketingApp.Tests/Regression/). Fails the CI job if any
      # regression is introduced.
      - name: Restore + build test project
        run: |
          dotnet restore src/MarketingApp.Tests/MarketingApp.Tests.csproj
          dotnet build   src/MarketingApp.Tests/MarketingApp.Tests.csproj -c Release --no-restore
      - name: Run regression tests
        run: |
          dotnet test src/MarketingApp.Tests/MarketingApp.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~Regression" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=regression.trx"
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: src/MarketingApp.Tests/TestResults/regression.trx
          retention-days: 30

      # --- Frontend ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install + typecheck + build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

  # =========================================================================
  # Deploy job — branch-based target selection
  #
  #   refs/heads/master  → live  (production app.samdigital.ae)
  #   refs/heads/staging → staging (staging.app.samdigital.ae)
  #   other branches     → skipped entirely
  #
  # CI still runs build + regression on every push to feature branches; only
  # the deploy step is branch-gated.
  # =========================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging'
    steps:
      - name: Resolve deployment target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
            echo "deploy_path=/opt/marketingapp-staging" >> "$GITHUB_OUTPUT"
            echo "branch=staging" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.staging.yml" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying to STAGING (staging.app.samdigital.ae)"
          else
            echo "target=live" >> "$GITHUB_OUTPUT"
            echo "deploy_path=${{ secrets.VPS_DEPLOY_PATH }}" >> "$GITHUB_OUTPUT"
            echo "branch=master" >> "$GITHUB_OUTPUT"
            echo "compose=docker-compose.prod.yml" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying to LIVE (app.samdigital.ae)"
          fi

      # First-time setup: secrets may not yet be configured. We don't want every
      # push to show a red ✗ in that case — we want a clean green ✓ with a
      # warning, and the deploy step is simply skipped. Once the user adds the
      # 4 secrets (VPS_HOST/USER/SSH_KEY/DEPLOY_PATH), the next push auto-deploys.
      - name: Check deployment secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::warning::VPS_HOST secret not configured — skipping deploy. Add Settings → Secrets and variables → Actions → VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH to enable auto-deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: TARGET,DEPLOY_PATH,BRANCH,COMPOSE
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            # deploy.sh handles target-specific paths, env files, and nginx
            # vhost splicing for staging. Single command for both targets.
            bash deploy.sh --target "$TARGET"
            # Prune dangling images so the disk doesn't fill up over time.
            docker image prune -af --filter "until=168h"
            # Verify the API is responding (5 retries, 5s apart). Container
            # name varies by target.
            if [ "$TARGET" = "staging" ]; then
              API_CONTAINER="marketingapp-staging-api"
            else
              API_CONTAINER="marketingapp-api"
            fi
            for i in 1 2 3 4 5; do
              if docker exec "$API_CONTAINER" curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "✅ $TARGET deploy healthy"
                exit 0
              fi
              echo "waiting for $TARGET API to come up... ($i/5)"
              sleep 5
            done
            echo "❌ $TARGET API didn't become healthy in time"
            docker compose -f "$COMPOSE" logs --tail 80 api
            exit 1
        env:
          TARGET: ${{ steps.target.outputs.target }}
          DEPLOY_PATH: ${{ steps.target.outputs.deploy_path }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMPOSE: ${{ steps.target.outputs.compose }}
