# =========================================================================
# CI/CD — on push to master: build + verify on a GitHub runner, then deploy
# ON the VPS itself via a self-hosted runner.
#
# Why self-hosted for deploy?
#   GitHub-hosted runners couldn't reach the VPS over SSH (port 22 i/o timeout —
#   the VPS firewall / fail2ban blocks inbound from GitHub's rotating IP ranges).
#   A self-hosted runner flips the direction: the VPS makes an OUTBOUND long-poll
#   to GitHub, picks up the job, and runs the deploy locally. No inbound SSH, no
#   firewall changes, no key management. `git push` → live update, every time.
#
# Flow:
#   1. ci     — GitHub-hosted: restore + build .NET API and frontend, typecheck.
#               Fails fast so a bad push never reaches the server.
#   2. deploy — self-hosted (runs ON the VPS): git pull + docker compose up.
#               Only runs on master, only after ci passes.
#
# One-time VPS setup (install + register the runner as a service) is documented
# in CONTRIBUTING.md §7. After that, this file needs no secrets.
# =========================================================================

name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:   # lets you trigger a redeploy manually from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  ci:
    name: Build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore + build API
        run: |
          dotnet restore src/MarketingApp.API/MarketingApp.API.csproj
          dotnet build   src/MarketingApp.API/MarketingApp.API.csproj -c Release --no-restore

      # --- Frontend ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install + typecheck + build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build

  deploy:
    name: Deploy on VPS (self-hosted)
    needs: ci
    if: github.ref == 'refs/heads/master'
    # Targets the runner installed on the VPS (labels set at registration time).
    runs-on: [self-hosted, marketingapp]
    steps:
      - name: Pull latest + rebuild + restart
        run: |
          set -euo pipefail
          cd /opt/marketingapp
          echo "▸ Fetching latest master…"
          git fetch origin master
          git reset --hard origin/master
          echo "▸ Rebuilding + restarting containers…"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          # Prune dangling images so the disk doesn't fill up over time (non-fatal).
          docker image prune -af --filter "until=168h" || true
          echo "▸ Waiting for API health…"
          for i in 1 2 3 4 5; do
            if docker exec marketingapp-api curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ deploy healthy"
              exit 0
            fi
            echo "waiting for API to come up... ($i/5)"
            sleep 5
          done
          echo "❌ API didn't become healthy in time"
          docker compose -f docker-compose.prod.yml logs --tail 80 api
          exit 1
