# =========================================================================
# MarketingApp — reverse proxy server blocks
#
# Replace `app.samdigital.ae` and `api.samdigital.ae` with your real
# subdomains (or use Find-Replace before deploying). The Let's Encrypt
# certificate paths assume you've already run certbot on the VPS (see
# DEPLOY.md for the one-time setup).
#
# Adding a SECOND app on the same VPS later? Just drop another file like
# `marketingapp2.conf` here pointing to the second app's containers — no
# code changes needed.
# =========================================================================

# --- ACME challenge (Let's Encrypt) on HTTP — handles cert issuance/renewal ---
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force every other HTTP request to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============== FRONTEND: https://app.samdigital.ae ==============
server {
    listen 443 ssl;
    http2 on;
    server_name app.samdigital.ae;

    ssl_certificate     /etc/letsencrypt/live/app.samdigital.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.samdigital.ae/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Resolve upstreams at REQUEST time via docker's embedded DNS (127.0.0.11) instead of at
    # startup. A bare `proxy_pass http://frontend` forces nginx to resolve "frontend" while loading
    # config; if that container is briefly unresolvable (restart/redeploy race) nginx aborts with
    # "host not found in upstream" and crash-loops — taking 443 down. Using a resolver + a variable
    # in proxy_pass defers resolution so nginx always starts and reconnects when the upstream returns.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend frontend;

    # Standard security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://$upstream_frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ============== API: https://api.samdigital.ae ==============
server {
    listen 443 ssl;
    http2 on;
    server_name api.samdigital.ae;

    # NOTE: certbot issues ONE SAN certificate covering both app. and api. subdomains,
    # and stores it under the FIRST domain's directory (app.*) only — the api.* path
    # doesn't exist on disk. Both server blocks reuse that single cert file. Safe
    # because the cert's Subject Alternative Names include both hostnames.
    ssl_certificate     /etc/letsencrypt/live/app.samdigital.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.samdigital.ae/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Defer upstream resolution to request time (see the frontend block for the full rationale) —
    # prevents nginx from crash-looping when the api container is momentarily unresolvable.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api api;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;

    # SignalR hub — needs WebSocket upgrade headers. Long timeouts so the persistent
    # connection isn't killed mid-conversation.
    location /hubs/ {
        proxy_pass         http://$upstream_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Tracking pixel + click redirect — public, no auth. Must be reachable by
    # Gmail's image proxy so OPENS get recorded.
    location ~ ^/track/ {
        proxy_pass         http://$upstream_api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else — the REST API.
    location / {
        proxy_pass         http://$upstream_api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
