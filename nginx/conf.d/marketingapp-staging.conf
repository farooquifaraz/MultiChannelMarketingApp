# =========================================================================
# Staging vhosts — proxied by the SHARED prod nginx (only one process owns
# 80/443 on the VPS). Container DNS reaches into the staging compose project.
#
# Activated automatically when deploy.sh --target staging runs and connects
# the prod nginx container to the marketingapp_staging network.
#
# Replace `app.yourdomain.com` / `api.yourdomain.com` with the real subdomains
# at deploy time — the same sed pattern deploy.sh already uses for prod also
# touches this file (search-replace "yourdomain.com" → samdigital.ae).
# =========================================================================

# ============== FRONTEND: https://staging.app.samdigital.ae ==============
server {
    listen 443 ssl;
    http2 on;
    server_name staging.app.yourdomain.com;

    # SAN cert shared with the staging.api.* hostname.
    ssl_certificate     /etc/letsencrypt/live/staging.app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive" always;  # keep staging out of search engines

    location / {
        proxy_pass         http://marketingapp-staging-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ============== API: https://staging.api.samdigital.ae ==============
server {
    listen 443 ssl;
    http2 on;
    server_name staging.api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/staging.app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive" always;

    location /hubs/ {
        proxy_pass         http://marketingapp-staging-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/track/ {
        proxy_pass         http://marketingapp-staging-api:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://marketingapp-staging-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
